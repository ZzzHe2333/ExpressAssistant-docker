services:
  expressassistant:
    build: .
    image: expressassistant-headless:local
    restart: unless-stopped
    environment:
      API_KEY: "${API_KEY:?Set_API_KEY_in_.env}"
      PORT: "8766"
      HOST: "0.0.0.0"
      DB_PATH: "/data/packages.db"
      COOKIE_FILE: "/data/taobao.cookie"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-900}"
      MAX_ORDER_PAGES: "${MAX_ORDER_PAGES:-3}"
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - expressassistant_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  expressassistant_data:
